name: Build Chandravanshi Mahasabha APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Platform
        run: |
          flutter create --platforms=android --org com.chandravanshi --project-name chandravanshi_mahasabha_app --no-pub .

      - name: Set App Name to Capital
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Chandravanshi Mahasabha"/' android/app/src/main/AndroidManifest.xml || true

      - name: Setup Firebase Config
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chandravanshi-Mahasabha-App
          path: build/app/outputs/flutter-apk/app-release.apk
