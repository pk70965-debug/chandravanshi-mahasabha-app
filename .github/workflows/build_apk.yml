name: Build Chandravanshi Mahasabha APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Platform
        run: flutter create --platforms=android --org com.chandravanshi .

      - name: Set App Name to Capital
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Chandravanshi Mahasabha"/' android/app/src/main/AndroidManifest.xml || true

      - name: Configure Firebase & Google Services
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json || true
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle || true
          echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle

      - name: Generate Keystore and Print SHA
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias chandravanshi -keyalg RSA -keysize 2048 -validity 10000 -storepass chandravanshi123 -keypass chandravanshi123 -dname "CN=Chandravanshi, OU=Mahasabha, O=ABCKM, L=Koderma, S=Jharkhand, C=IN"
          keytool -list -v -keystore release.keystore -alias chandravanshi -storepass chandravanshi123

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build APK (Signed)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chandravanshi-Mahasabha-App
          path: build/app/outputs/flutter-apk/app-release.apk
