publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "IMG_20260925_175930.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A192F"
  adaptive_icon_foreground: "IMG_20260925_175930.png"

flutter:
  uses-material-design: true
  assets:
    - IMG_20260925_175930.png
    - IMG_20260929_050630.jpg
